<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <!-- JQuery -->
    <script src="../jquery.min.js"></script>
    <script src="../jquery-ui.min.js"></script>

    <!-- Debugging -->
    <script src="../jsDump.js"></script>

    <!-- Plugin detection -->
    <script src="../PluginDetect.js"></script>

    <!-- Utilities -->
    <script src="../util.js"></script>
    <script src="../shuffle.js"></script>
    <script src="../json.js"></script>

    <!-- Counter -->
    <script src="../../counter?exp={{ experiment_name | urlencode }}"></script>

    <script type="application/x-javascript">
      var __server_py_script_name__ = 'server.py';
    </script>

    <!-- PennController -->
    <script src="../../js_includes/{{ experiment_name }}/AcceptabilityJudgment.js"></script>
    <script src="../../js_includes/{{ experiment_name }}/DashedAcceptabilityJudgment.js"></script>
    <script src="../../js_includes/{{ experiment_name }}/DashedSentence.js"></script>
    <script src="../../js_includes/{{ experiment_name }}/FlashSentence.js"></script>
    <script src="../../js_includes/{{ experiment_name }}/Form.js"></script>
    <script src="../../js_includes/{{ experiment_name }}/Message.js"></script>
    <script src="../../js_includes/{{ experiment_name }}/PennController.js"></script>
    <script src="../../js_includes/{{ experiment_name }}/Question.js"></script>
    <script src="../../js_includes/{{ experiment_name }}/Scale.js"></script>
    <script src="../../js_includes/{{ experiment_name }}/Separator.js"></script>
    <script src="../../js_includes/{{ experiment_name }}/VBox.js"></script>

    <!-- Sound -->
    <script src="../soundmanager2-jsmin.js"></script>

    <!-- Backward compatibility -->
    <script src="../backcompatcruft.js"></script>

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="../../css_includes/{{ experiment_name }}/DashedSentence.css"
    />
    <link
      rel="stylesheet"
      href="../../css_includes/{{ experiment_name }}/FlashSentence.css"
    />
    <link
      rel="stylesheet"
      href="../../css_includes/{{ experiment_name }}/Form.css"
    />
    <link
      rel="stylesheet"
      href="../../css_includes/{{ experiment_name }}/global_main.css"
    />
    {% if has_global_z_css %}
      <link
        rel="stylesheet"
        href="../../css_includes/{{ experiment_name }}/global_z.css"
      />
    {% endif %}
    <link
      rel="stylesheet"
      href="../../css_includes/{{ experiment_name }}/Message.css"
    />
    <link
      rel="stylesheet"
      href="../../css_includes/{{ experiment_name }}/Question.css"
    />
    <link
      rel="stylesheet"
      href="../../css_includes/{{ experiment_name }}/Scale.css"
    />
    <link
      rel="stylesheet"
      href="../../css_includes/{{ experiment_name }}/Separator.css"
    />


    <!-- Experiment -->
    <script src="../../data_includes/{{ experiment_name }}/main.js"></script>
    <!-- Config -->
    <script src="../conf.js"></script>
    <script src="../../other_includes/main.js"></script>

    <title>Saarland Experiment</title>
    <script type="application/x-javascript">
      document.title = conf_pageTitle;
    </script>
  </head>

  <body id="bod">
    <noscript>
      <p>You need to have Javascript enabled in order to use this page.</p>
    </noscript>
  </body>
</html>
